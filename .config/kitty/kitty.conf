# Kitty config — AeroSpace compatible

# Font
font_family      Hack Nerd Font Mono
font_size        13.0

# Shell integration
shell_integration enabled

# ---- Catppuccin Mocha Theme ----
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
url_color               #f5e0dc
background_opacity      1.0

# Window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# black
color0 #45475a
color8 #585b70
# red
color1 #f38ba8
color9 #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8

# Tab bar — Catppuccin Mocha style
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template        {index}: {title}
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
inactive_tab_font_style normal
tab_bar_background      #11111b

# Tabs
map cmd+t new_tab_with_cwd
map cmd+w close_tab
map cmd+shift+left previous_tab
map cmd+shift+right next_tab
map cmd+shift+bracketleft previous_tab
map cmd+shift+bracketright next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Splits (within kitty, inside one window — AeroSpace safe)
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+enter toggle_layout stack

# Navigate splits
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down

# Resize splits
map cmd+ctrl+left resize_window narrower 3
map cmd+ctrl+right resize_window wider 3
map cmd+ctrl+up resize_window taller 3
map cmd+ctrl+down resize_window shorter 3

# Scrollback
scrollback_lines 10000
map cmd+k clear_terminal scrollback active
map cmd+shift+k clear_terminal reset active

# URL handling — click to open
detect_urls yes
open_url_with default

# Copy/paste
copy_on_select clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Window padding
window_padding_width 8

# No confirm on close
confirm_os_window_close 0

# Bell
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #f38ba8

# Performance
repaint_delay 6
input_delay 1
sync_to_monitor yes

# macOS specific
macos_option_as_alt yes
macos_titlebar_color background
macos_quit_when_last_window_closed yes
macos_show_backend_kitty_indicator no
